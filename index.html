<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>ESCAPE SCHOOL</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

body{
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    width:100vw;
    height:100vh;
    image-rendering:pixelated;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;

    display:flex;
    justify-content:space-between;
    gap:10px;
}

.box{
    background:rgba(10,12,18,.9);
    color:white;
    border:2px solid #777;
    border-radius:12px;
    padding:9px 13px;
    font-size:14px;
    box-shadow:0 4px 12px #0008;
}

#message{
    position:fixed;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);

    width:90%;
    max-width:500px;

    background:rgba(10,12,18,.95);
    color:white;

    border:2px solid #aaa;
    border-radius:15px;

    padding:14px;
    text-align:center;

    z-index:20;
    display:none;
}

#controls{
    position:fixed;
    bottom:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:end;

    z-index:30;
}

#dpad{
    width:155px;
    height:155px;
    position:relative;
}

.btn{
    position:absolute;

    width:52px;
    height:52px;

    border-radius:14px;

    border:2px solid #8991a2;

    background:rgba(25,28,38,.94);
    color:white;

    font-size:24px;
    font-weight:bold;
}

.btn:active{
    background:#596176;
    transform:scale(.94);
}

#up{
    left:51px;
    top:0;
}

#down{
    left:51px;
    bottom:0;
}

#left{
    left:0;
    top:51px;
}

#right{
    right:0;
    top:51px;
}

#action{
    width:85px;
    height:85px;

    border-radius:50%;

    background:rgba(25,28,38,.96);
    color:white;

    border:3px solid #aaa;

    font-size:13px;
    font-weight:bold;
}

#codeScreen{
    position:fixed;
    inset:0;

    background:#000b;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:100;
}

#codePanel{
    width:85%;
    max-width:350px;

    background:#1b1e27;

    border:2px solid #999;
    border-radius:18px;

    padding:25px;

    text-align:center;
    color:white;
}

#codeInput{
    width:100%;

    margin:15px 0;

    padding:12px;

    font-size:25px;
    text-align:center;

    background:#090b10;
    color:white;

    border:2px solid #777;
    border-radius:10px;
}

#openCode{
    padding:12px 25px;

    border:0;
    border-radius:10px;

    background:#e7c86a;

    font-weight:bold;
}

#finish{
    position:fixed;
    inset:0;

    background:#090b10;

    color:white;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    z-index:200;

    padding:25px;
}

#finish h1{
    font-size:42px;
    color:#e7c86a;
    margin-bottom:15px;
}

.restart{
    margin-top:20px;

    padding:13px 25px;

    border:0;
    border-radius:12px;

    background:#e7c86a;

    font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="box">
        🏫 <span id="floor">PARTER</span>
    </div>

    <div class="box">
        🔎 <span id="clues">0</span>/8
        &nbsp;
        ⏱️ <span id="time">15:00</span>
    </div>

</div>

<div id="message"></div>

<div id="controls">

    <div id="dpad">

        <button class="btn" id="up">▲</button>
        <button class="btn" id="down">▼</button>
        <button class="btn" id="left">◀</button>
        <button class="btn" id="right">▶</button>

    </div>

    <button id="action">
        E<br>
        INTERAKCJA
    </button>

</div>

<div id="codeScreen">

    <div id="codePanel">

        <h2>🔐 DRZWI</h2>

        <p style="margin-top:10px">
            Wpisz znaleziony kod
        </p>

        <input
            id="codeInput"
            inputmode="numeric"
            maxlength="4"
            placeholder="____">

        <button id="openCode">
            OTWÓRZ
        </button>

    </div>

</div>

<div id="finish">

    <h1>🔓 UCIECZKA!</h1>

    <p>
        Udało Ci się przejść przez szkołę.
    </p>

    <p id="stats" style="margin-top:15px"></p>

    <button class="restart"
            onclick="location.reload()">
        ZAGRAJ PONOWNIE
    </button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=960;
let H=540;

canvas.width=W;
canvas.height=H;


/* =========================
   GRA
========================= */

let level=0;
let cluesFound=0;
let levelClues=0;

let gameRunning=true;

let startTime=Date.now();

const gameTime=15*60;


/* =========================
   GRACZ
========================= */

const player={
    x:480,
    y:270,
    speed:3.5
};


/* =========================
   STEROWANIE
========================= */

const keys={
    up:false,
    down:false,
    left:false,
    right:false
};


/* =========================
   MAPA
========================= */

let walls=[];
let rooms=[];
let clues=[];
let npcs=[];
let exitDoor=null;


/* =========================
   NAZWY POZIOMÓW
========================= */

const levelNames=[
    "PARTER",
    "PIĘTRO 1",
    "PIĘTRO 2",
    "NOWY BUDYNEK",
    "PIWNICA"
];


/* =========================
   FUNKCJE
========================= */

function resetMap(){

    walls=[];
    rooms=[];
    clues=[];
    npcs=[];
    exitDoor=null;

    levelClues=0;

    player.x=480;
    player.y=270;

    createSchool();

}


/* =========================
   SZKOŁA
========================= */

function createSchool(){

    /* zewnętrzne ściany */

    walls.push(
        {x:35,y:45,w:890,h:25},
        {x:35,y:470,w:890,h:25},
        {x:35,y:45,w:25,h:450},
        {x:800,y:45,w:25,h:450}
    );


    /* główny korytarz */

    walls.push(
        {x:70,y:200,w:700,h:25},
        {x:70,y:315,w:700,h:25}
    );


    /* sale */

    addRoom(
        80,85,130,95,"SALA 101"
    );

    addRoom(
        225,85,130,95,"SALA 102"
    );

    addRoom(
        370,85,130,95,"SALA 106"
    );

    addRoom(
        515,85,130,95,"SALA 107"
    );

    addRoom(
        660,85,110,95,"SALA 109"
    );


    addRoom(
        80,345,150,105,"SALA 112"
    );

    addRoom(
        245,345,150,105,"PRACOWNIA"
    );

    addRoom(
        410,345,150,105,"BIBLIOTEKA"
    );

    addRoom(
        575,345,195,105,"SEKRETARIAT"
    );


    /* wskazówki */

    addClue(145,135);
    addClue(290,135);
    addClue(435,135);
    addClue(600,135);

    addClue(145,400);
    addClue(320,400);
    addClue(480,400);
    addClue(675,400);


    /* nauczyciele / NPC */

    npcs.push({
        x:250,
        y:265,
        type:"npc"
    });

    npcs.push({
        x:700,
        y:265,
        type:"npc"
    });


    /* drzwi */

    exitDoor={
        x:770,
        y:260
    };

}


/* =========================
   SALE
========================= */

function addRoom(x,y,w,h,name){

    rooms.push({
        x:x,
        y:y,
        w:w,
        h:h,
        name:name
    });

}


/* =========================
   WSKAZÓWKI
========================= */

function addClue(x,y){

    clues.push({
        x:x,
        y:y,
        found:false
    });

}


/* =========================
   ŁADOWANIE POZIOMU
========================= */

function loadLevel(n){

    level=n;

    document.getElementById("floor")
        .textContent=levelNames[level];

    resetMap();

    showMessage(
        level===0
        ?
        "🏫 Znajdź wskazówki ukryte w szkole."
        :
        "🔎 Przeszukaj ten poziom i znajdź wskazówki."
    );

}


/* =========================
   RYSOWANIE SZKOŁY
========================= */

function drawSchool(){

    /* tło */

    ctx.fillStyle=
        level===4
        ? "#16171b"
        : "#686d75";

    ctx.fillRect(
        0,0,W,H
    );


    /* podłoga */

    if(level!==4){

        ctx.fillStyle="#9b9da0";

        for(let x=60;x<800;x+=40){

            for(let y=70;y<470;y+=40){

                ctx.fillRect(
                    x,
                    y,
                    38,
                    38
                );

            }

        }

    }


    /* pokoje */

    for(const room of rooms){

        ctx.fillStyle="#bfc1c4";

        ctx.fillRect(
            room.x,
            room.y,
            room.w,
            room.h
        );

        ctx.strokeStyle="#24272d";

        ctx.lineWidth=5;

        ctx.strokeRect(
            room.x,
            room.y,
            room.w,
            room.h
        );


        /* nazwa sali */

        ctx.fillStyle="#202329";

        ctx.font="bold 15px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            room.name,
            room.x+room.w/2,
            room.y+room.h/2
        );

        ctx.textAlign="left";

    }


    /* ściany */

    ctx.fillStyle="#292c33";

    for(const wall of walls){

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /* drzwi */

    if(exitDoor){

        ctx.fillStyle="#6b452b";

        ctx.fillRect(
            exitDoor.x-8,
            exitDoor.y-28,
            16,
            56
        );

        ctx.fillStyle="#e4c762";

        ctx.fillRect(
            exitDoor.x+2,
            exitDoor.y,
            4,
            4
        );

    }


    /* wskazówki */

    for(const clue of clues){

        if(clue.found)
            continue;


        ctx.fillStyle="#f0cf58";

        ctx.fillRect(
            clue.x-9,
            clue.y-9,
            18,
            18
        );


        ctx.fillStyle="#fff5a6";

        ctx.fillRect(
            clue.x-4,
            clue.y-15,
            8,
            6
        );


        ctx.font="bold 12px Arial";

        ctx.fillStyle="#111";

        ctx.fillText(
            "?",
            clue.x-4,
            clue.y+5
        );

    }


    /* NPC */

    for(const npc of npcs){

        drawNPC(
            npc.x,
            npc.y
        );

    }

}


/* =========================
   PIXELOWY NAUCZYCIEL
========================= */

function drawPlayer(){

    const x=Math.round(player.x);
    const y=Math.round(player.y);


    ctx.save();

    ctx.translate(x,y);


    /* cień */

    ctx.fillStyle="#0008";

    ctx.fillRect(
        -24,
        28,
        48,
        8
    );


    /* nogi */

    ctx.fillStyle="#202532";

    ctx.fillRect(
        -15,
        10,
        11,
        22
    );

    ctx.fillRect(
        4,
        10,
        11,
        22
    );


    /* buty */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -18,
        28,
        15,
        6
    );

    ctx.fillRect(
        3,
        28,
        15,
        6
    );


    /* marynarka */

    ctx.fillStyle="#14213b";

    ctx.fillRect(
        -23,
        -8,
        46,
        28
    );


    /* koszula */

    ctx.fillStyle="#eee";

    ctx.fillRect(
        -10,
        -8,
        20,
        26
    );


    /* głowa */

    ctx.fillStyle="#c98e70";

    ctx.fillRect(
        -15,
        -38,
        30,
        30
    );


    /* uszy */

    ctx.fillRect(
        -18,
        -27,
        4,
        10
    );

    ctx.fillRect(
        14,
        -27,
        4,
        10
    );


    /* włosy */

    ctx.fillStyle="#30251f";

    ctx.fillRect(
        -15,
        -42,
        30,
        9
    );

    ctx.fillRect(
        -9,
        -46,
        19,
        6
    );


    /* oczy */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -8,
        -25,
        5,
        5
    );

    ctx.fillRect(
        4,
        -25,
        5,
        5
    );


    /* nos */

    ctx.fillRect(
        -2,
        -19,
        4,
        5
    );


    /* uśmiech */

    ctx.fillRect(
        -6,
        -12,
        12,
        3
    );


    /* guziki */

    ctx.fillStyle="#ddd";

    ctx.fillRect(
        -2,
        0,
        4,
        4
    );

    ctx.fillRect(
        -2,
        8,
        4,
        4
    );


    ctx.restore();

}


/* =========================
   NPC
========================= */

function drawNPC(x,y){

    ctx.fillStyle="#a97fc2";

    ctx.fillRect(
        x-13,
        y-2,
        26,
        30
    );


    ctx.fillStyle="#d19b7c";

    ctx.fillRect(
        x-11,
        y-25,
        22,
        23
    );


    ctx.fillStyle="#33272c";

    ctx.fillRect(
        x-12,
        y-28,
        24,
        8
    );


    ctx.fillStyle="#fff";

    ctx.font="bold 20px Arial";

    ctx.fillText(
        "!",
        x-4,
        y-33
    );

}


/* =========================
   KOLIZJE
========================= */

function collision(x,y){

    const size=17;

    for(const wall of walls){

        if(
            x+size>wall.x &&
            x-size<wall.x+wall.w &&
            y+size>wall.y &&
            y-size<wall.y+wall.h
        ){

            return true;

        }

    }

    return false;

}


/* =========================
   RUCH
========================= */

function update(){

    let dx=0;
    let dy=0;


    if(keys.left)
        dx-=player.speed;

    if(keys.right)
        dx+=player.speed;

    if(keys.up)
        dy-=player.speed;

    if(keys.down)
        dy+=player.speed;


    if(dx && dy){

        dx*=.7;
        dy*=.7;

    }


    if(!collision(
        player.x+dx,
        player.y
    )){

        player.x+=dx;

    }


    if(!collision(
        player.x,
        player.y+dy
    )){

        player.y+=dy;

    }


    /* granice */

    player.x=Math.max(
        70,
        Math.min(790,player.x)
    );

    player.y=Math.max(
        80,
        Math.min(455,player.y)
    );

}


/* =========================
   INTERAKCJA
========================= */

function interact(){

    /* wskazówki */

    for(const clue of clues){

        if(
            !clue.found &&
            distance(
                player,
                clue
            )<45
        ){

            clue.found=true;

            cluesFound++;
            levelClues++;

            document.getElementById(
                "clues"
            ).textContent=cluesFound;


            beep(800,.15);


            showMessage(
                "🔎 Znalazłeś wskazówkę!"
            );


            return;

        }

    }


    /* NPC */

    for(const npc of npcs){

        if(
            distance(
                player,
                npc
            )<60
        ){

            showMessage(
                "👤 Hmm... wygląda na to, że powinieneś dokładnie przeszukać sale."
            );

            return;

        }

    }


    /* drzwi */

    if(
        exitDoor &&
        distance(
            player,
            exitDoor
        )<70
    ){

        nextLevel();

    }

}


/* =========================
   NASTĘPNY POZIOM
========================= */

function nextLevel(){

    if(level===0){

        if(levelClues<2){

            showMessage(
                "🔒 Potrzebujesz jeszcze wskazówek."
            );

            return;

        }

        openCode();

        return;

    }


    if(level===1 ||
       level===2 ||
       level===3){

        if(levelClues<2){

            showMessage(
                "🔒 Najpierw znajdź 2 wskazówki."
            );

            return;

        }

        loadLevel(level+1);

        return;

    }


    if(level===4){

        finish();

    }

}


/* =========================
   KOD
========================= */

function openCode(){

    document.getElementById(
        "codeScreen"
    ).style.display="flex";

    document.getElementById(
        "codeInput"
    ).focus();

}


document.getElementById(
    "openCode"
).onclick=function(){

    const code=
        document.getElementById(
            "codeInput"
        ).value;


    if(code==="2417"){

        document.getElementById(
            "codeScreen"
        ).style.display="none";

        loadLevel(1);

        beep(1000,.2);

    }else{

        showMessage(
            "❌ Nieprawidłowy kod."
        );

    }

};


/* =========================
   ODLEGŁOŚĆ
========================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================
   WIADOMOŚĆ
========================= */

let messageTimer;

function showMessage(text){

    const box=
        document.getElementById(
            "message"
        );

    box.innerHTML=text;

    box.style.display="block";


    clearTimeout(messageTimer);


    messageTimer=setTimeout(
        ()=>{
            box.style.display="none";
        },
        3000
    );

}


/* =========================
   AUDIO
========================= */

let audio;

function audioInit(){

    if(!audio){

        audio=new AudioContext();

    }

    if(audio.state==="suspended")
        audio.resume();

}


function beep(freq,duration){

    audioInit();

    const osc=
        audio.createOscillator();

    const gain=
        audio.createGain();


    osc.frequency.value=freq;

    osc.type="square";

    gain.gain.value=.04;


    osc.connect(gain);

    gain.connect(
        audio.destination
    );


    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+duration
    );

    osc.stop(
        audio.currentTime+duration
    );

}


/* =========================
   TIMER
========================= */

function timer(){

    const elapsed=
        Math.floor(
            (Date.now()-startTime)/1000
        );


    const left=
        Math.max(
            0,
            gameTime-elapsed
        );


    const min=
        Math.floor(left/60);

    const sec=
        left%60;


    document.getElementById(
        "time"
    ).textContent=

        String(min).padStart(2,"0")
        +
        ":"
        +
        String(sec).padStart(2,"0");


    if(left<=0){

        gameRunning=false;

        showMessage(
            "⏰ CZAS MINĄŁ!"
        );

    }

}


/* =========================
   PIWNICA
========================= */

function drawBasement(){

    ctx.fillStyle="#111216";

    ctx.fillRect(
        0,0,W,H
    );


    /* ściany piwnicy */

    ctx.strokeStyle="#555";

    ctx.lineWidth=8;

    ctx.strokeRect(
        70,
        70,
        700,
        380
    );


    /* pomieszczenia */

    ctx.strokeStyle="#3e4249";

    ctx.lineWidth=5;

    ctx.strokeRect(
        90,
        100,
        250,
        150
    );

    ctx.strokeRect(
        500,
        100,
        240,
        150
    );


    ctx.fillStyle="#999";

    ctx.font="bold 18px Arial";

    ctx.fillText(
        "PIWNICA",
        420,
        90
    );


    ctx.fillStyle="#d4bd73";

    ctx.fillText(
        "🔑",
        680,
        390
    );

}


/* =========================
   KONIEC
========================= */

function finish(){

    gameRunning=false;


    const elapsed=
        Math.floor(
            (Date.now()-startTime)/1000
        );


    const min=
        Math.floor(elapsed/60);

    const sec=
        elapsed%60;


    document.getElementById(
        "stats"
    ).innerHTML=

        "Czas: "+
        min+
        ":"+
        String(sec).padStart(2,"0")+
        "<br><br>"+
        "Wskazówki: "+
        cluesFound+
        "/8";


    document.getElementById(
        "finish"
    ).style.display="flex";

}


/* =========================
   RYSOWANIE
========================= */

function draw(){

    drawSchool();


    if(level===4){

        drawBasement();

    }


    drawPlayer();

}


/* =========================
   PĘTLA
========================= */

function loop(){

    if(gameRunning){

        update();

        timer();

        draw();

    }


    requestAnimationFrame(loop);

}


/* =========================
   K
